components:
  schemas:
    Empresa:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: "Empresa 1"
        descricao:
          type: string
          example: "Descricao da empresa 1"
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2022-01-01T00:00:00.000Z"
        updated_at:
          type: string
          format: date-time
          example: "2022-01-01T00:00:00.000Z"
    CreateEmpresa:
      type: object
      properties:
        nome:
          type: string
          example: "Empresa 1"
        descricao:
          type: string
          example: "Descricao da empresa 1"
        enabled:
          type: boolean
          example: true
    UpdateEmpresa:
      type: object
      properties:
        nome:
          type: string
          example: "Empresa 1"
        descricao:
          type: string
          example: "Descricao da empresa 1"
        enabled:
          type: boolean
          example: true
    DisableEmpresa:
      type: object
      properties:
        enabled:
          type: boolean
          example: false