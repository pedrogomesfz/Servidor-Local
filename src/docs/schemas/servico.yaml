# Schema/servico.yaml

components:
  schemas:

    # Schema principal de serviço
    Servico:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: "Serviço de limpeza"
        descricao:
          type: string
          example: "Serviço de limpeza profissional para residências e empresas."
        categoria:
          type: string
          example: "Limpeza"
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2022-02-02T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2022-02-02T00:00:00Z"

    # Schema para criar um novo serviço
    CreateService:
      type: object
      properties:
        nome:
          type: string
          example: "Serviço de limpeza"
        descricao:
          type: string
          example: "Serviço de limpeza profissional"
        categoria:
          type: string
          example: "Limpeza"
        enabled:
          type: boolean
          example: true

    # Schema genérico de sucesso
    ResponseSuccess:
      type: object
      properties:
        message:
          type: string
          example: "Serviço criado com sucesso"
        status:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Servico"

    # Schema genérico de erro
    ResponseError:
      type: object
      properties:
        message:
          type: string
          example: "Erro na requisição"
        data:
          type: object
          properties:
            nome:
              type: string
              example: null

    # schema para buscar servico detalhado
    ServicoDetalhado:
      type: object
      properties:
        id:
          type: string
          example: "Serviço de limpesa profissional para residencias e empresas."
        nome: 
          type: string
          example: "serviço de limpesa"
        descricao:
          type: string
          example: "serviço de limpesa profissional"
        designacao_categoria:
          type: string
          example: "Limpeza"
        icone_categoria:
          type: string
          example: ""
        id_empresa:
          type: string
          example: "1"
        designacao_empresa:
          type: string
          example: "Empresa de limpeza "
        icone_empresa:
          type: string
          example: ""
        enabled:
          type: boolean
          example: true
