# Schema/proposta.yaml

components:
  schemas:

    # Schema principal de proposta
    proposta:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: "proposta de limpeza"
        descricao:
          type: string
          example: "proposta de limpeza profissional para residências e empresas."
        categoria:
          type: string
          example: "Limpeza"
        enabled:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2022-02-02T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2022-02-02T00:00:00Z"

    # Schema para criar um novo proposta
    CreateProposta:
      type: object
      properties:
        nome:
          type: string
          example: "proposta de limpeza"
        descricao:
          type: string
          example: "proposta de limpeza profissional"
        categoria:
          type: string
          example: "Limpeza"
        enabled:
          type: boolean
          example: true

    # Schema genérico de sucesso
    ResponseSuccess:
      type: object
      properties:
        message:
          type: string
          example: "proposta criado com sucesso"
        status:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/proposta"

    # Schema genérico de erro
    ResponseError:
      type: object
      properties:
        message:
          type: string
          example: "Erro na requisição"
        data:
          type: object
          properties:
            nome:
              type: string
              example: null

    # schema para aceitar proposta
    AceitarProposta:
      type: object
      properties:
        estado:
          type: string
          example: "aceita"
        updated_at:
          type: string
          format: date-time
          example: "2022-02-02T00:00:00Z"
        message:
          type: string
          example: "proposta aceita com sucesso"
        status:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/proposta"