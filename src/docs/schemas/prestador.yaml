components:
  schemas:

    # Schema principal
    Prestador:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "122f31ae-418c-4e3b-9ba5-2d3cb8cdaffd"

        nif:
          type: string
          example: "123456789"

        profissao:
          type: string
          example: "Carpintaria profissional"

        taxa_urgencia:
          type: number
          format: float
          example: 0.2

        minimo_desconto:
          type: number
          example: 1000

        percentagem_desconto:
          type: number
          format: float
          example: 0.1

        disponivel:
          type: boolean
          example: true

        enabled:
          type: boolean
          example: true

        created_at:
          type: string
          format: date-time
          example: "2022-02-02T00:00:00Z"

        updated_at:
          type: string
          format: date-time
          example: "2022-02-02T00:00:00Z"

      required:
        - id
        - nif
        - profissao
        - disponivel
        - enabled

    # Schema para criação
    CreatePrestador:
      type: object
      properties:
        nif:
          type: string
          example: "123456789"

        profissao:
          type: string
          example: "Carpintaria"

        taxa_urgencia:
          type: number
          example: 0.2

        minimo_desconto:
          type: number
          example: 1000

        percentagem_desconto:
          type: number
          example: 0.1

        disponivel:
          type: boolean
          example: true

        enabled:
          type: boolean
          example: true

      required:
        - nif
        - profissao

    # Response genérico
    ResponseSuccess:
      type: object
      properties:
        message:
          type: string
          example: "Operação realizada com sucesso"
        status:
          type: boolean
          example: true
        data:
          type: object

    # Response de erro
    ResponseError:
      type: object
      properties:
        message:
          type: string
          example: "Erro na requisição"
        status:
          type: boolean
          example: false
        data:
          type: object
          null: true