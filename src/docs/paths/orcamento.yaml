paths:

  /orcamento:
    get:
      summary: Listar todos os orçamentos
      tags:
        - Orcamento
      description: Retorna uma lista de todos os orçamentos disponíveis
      responses:
        "200":
          description: Lista de orçamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Orcamento"
        "404":
          description: Nenhum orçamento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    post:
      summary: Criar um novo orçamento
      tags:
        - Orcamento
      description: Cria um novo orçamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrcamento"
      responses:
        "200":
          description: Orçamento criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamento/{id}:
    get:
      summary: Buscar um orçamento por ID
      tags:
        - Orcamento
      description: Retorna um orçamento específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orçamento
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Orçamento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Orcamento"
        "404":
          description: Orçamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    put:
      summary: Atualizar um orçamento
      tags:
        - Orcamento
      description: Atualiza um orçamento pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orçamento
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrcamento"
      responses:
        "200":
          description: Orçamento atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Orçamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    delete:
      summary: Apagar um orçamento
      tags:
        - Orcamento
      description: Apaga um orçamento pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orçamento
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Orçamento apagado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Orçamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"