paths:

  /orcamento:
    get:
      summary: Listar todos os orçamentos
      tags:
        - orcamento
      description: Retorna uma lista de todos os orçamentos disponíveis
      responses:
        "200":
          description: Lista de orçamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/orcamento"
        "404":
          description: Nenhum orçamento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamento/create:
    post:
      summary: Criar um novo orcamento
      tags:
        - orcamento
      description: Cria um novo orcamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Createorcamento"
      responses:
        "200":
          description: orcamento criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamento/get-by-id/{id}:
    get:
      summary: Buscar um orcamento por ID
      tags:
        - orcamento
      description: Retorna um orcamento específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orcamento
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: orcamento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: orcamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamento/update/{id}:
    put:
      summary: Atualizar um orcamento
      tags:
        - orcamento
      description: Atualiza um orcamento pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orcamento a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Createorcamento"
      responses:
        "200":
          description: orcamento atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: orcamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /orcamento/delete/{id}:
    delete:
      summary: Apagar um orcamento
      tags:
        - orcamento
      description: Apaga um orcamento específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do orcamento a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: orcamento apagado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: orcamento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
