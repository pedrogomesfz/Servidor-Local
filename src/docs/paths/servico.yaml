# paths/servico.yaml

paths:

  /servico:
    get:
      summary: Listar todos os serviços
      tags:
        - Servico
      description: Retorna uma lista de todos os serviços disponíveis
      responses:
        "200":
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Servico"
        "404":
          description: Nenhum serviço encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /service/create:
    post:
      summary: Criar um novo serviço
      tags:
        - Servico
      description: Cria um novo serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateService"
      responses:
        "200":
          description: Serviço criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /service/get-by-id/{id}:
    get:
      summary: Buscar um serviço por ID
      tags:
        - Servico
      description: Retorna um serviço específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do serviço
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Serviço encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /service/update/{id}:
    put:
      summary: Atualizar um serviço
      tags:
        - Servico
      description: Atualiza um serviço pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do serviço a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateService"
      responses:
        "200":
          description: Serviço atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /service/delete/{id}:
    delete:
      summary: Apagar um serviço
      tags:
        - Servico
      description: Apaga um serviço específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do serviço a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Serviço apagado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Serviço não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
  /service/all-detailed:
    get:
      summary: Listar todoos os serviços detalhados
      tags:
        - Servico
      description: restorna uma lista de todos os srtviços disponiveis com detalhes
      parameters: 
        - name: limit
          in: query
          required: false
          description: Limit de serviços e serem retornados
          schema:
            type: interger
            example: 10
        - name: offset
          in: query
          required: false
          description: offset de serviços e serem retornados
          schema:
            type: interger
            example: 0
      responses:
        "200":
          description: Lista de serviços detalhados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Nenhum serviço encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        

