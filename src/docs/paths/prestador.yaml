paths:

  /prestador:
    get:
      summary: Listar todos os prestadores
      tags:
        - Prestador
      description: Retorna uma lista de todos os prestadores disponíveis
      responses:
        "200":
          description: Lista de prestadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prestador"
        "404":
          description: Nenhum prestador encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestador/create:
      summary: Criar um novo prestador
      tags:
        - Prestador
      description: Cria um novo prestador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestador"
      responses:
        "200":
          description: Prestador criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestador/get-by-id/{id}:
    get:
      summary: Buscar um prestador por ID
      tags:
        - Prestador
      description: Retorna um prestador específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestador
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Prestador encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prestador"
        "404":
          description: Prestador não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    put:
      summary: Atualizar um prestador
      tags:
        - Prestador
      description: Atualiza um prestador pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestador
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestador"
      responses:
        "200":
          description: Prestador atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Prestador não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    delete:
      summary: Apagar um prestador
      tags:
        - Prestador
      description: Apaga um prestador pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestador
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Prestador apagado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Prestador não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"