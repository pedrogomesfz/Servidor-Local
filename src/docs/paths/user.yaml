# paths/user.yaml

paths:
  /user:
    get:
      summary: Listar todos os users
      tags:
        - User
      description: Retorna uma lista de todos os users disponíveis
      responses:
        "200":
          description: Lista de users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/user"
        "404":
          description: Nenhum user encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /user/create:
    post:
      summary: Criar um novo user
      tags:
        - User
      description: Cria um novo user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "200":
          description: user criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /user/get-by-id/{id}:
    get:
      summary: Buscar um user por ID
      tags:
        - User
      description: Retorna um user específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do user
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: user encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: user não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /user/update/{id}:
    put:
      summary: Atualizar um user
      tags:
        - User
      description: Atualiza um user pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do user a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "200":
          description: user atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: user não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /user/delete/{id}:
    delete:
      summary: Apagar um user
      tags:
        - User
      description: Apaga um user específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do user a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: User apagado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: user não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
  
  /user/login:
    post:
      summary: Login de user
      tags:
        - User
      description: "Faz login de um usuário"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/loginUser"
      responses:
        "404":
          description: user não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
        "400":
          description: "Erro ao logar o user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"