# paths/prestacao.servicao.yaml

paths:

  /prestacao.servicao:
    get:
      summary: Listar todos os prestaçao de servicaos
      tags:
        -Prestacao.servico
      description: Retorna uma lista de todos os prestação de servicaos disponíveis
      responses:
        "200":
          description: Lista de prestação de servicaos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/prestacao.servicao"
        "404":
          description: Nenhum prestacao.servicao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestacao.servico/create:
    post:
      summary: Criar um novo prestação des servicao
      tags:
        -Prestacao.servico
      description: Cria um novo prestação de servicao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestacao.servicao"
      responses:
        "200":
          description: prestacao.servicao criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestacao.servico/get-by-id/{id}:
    get:
      summary: Buscar um prestacao.servicao por ID
      tags:
        -Prestacao.servico
      description: Retorna um prestacao.servicao específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestacao.servicao
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: prestacao.servicao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: prestacao.servicao não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestacao.servico/update/{id}:
    put:
      summary: Atualizar um prestacao.servicao
      tags:
        -Prestacao.servico
      description: Atualiza um prestacao.servicao pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestacao.servicao a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestacao.servicao"
      responses:
        "200":
          description: prestacao.servicao atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: prestacao.servicao não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestacao.servico/delete/{id}:
    delete:
      summary: Apagar um prestacao.servicao
      tags:
        -Prestacao.servico
      description: Apaga um prestacao.servicao específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do prestacao.servicao a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: prestacao.servicao apagado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: prestacao.servicao não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"