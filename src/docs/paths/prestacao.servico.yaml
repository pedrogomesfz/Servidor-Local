paths:

  /prestacao-servico:
    get:
      summary: Listar todas as prestações de serviço
      tags:
        - PrestacaoServico
      description: Retorna uma lista de todas as prestações de serviço disponíveis
      responses:
        "200":
          description: Lista de prestações de serviço
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrestacaoServico"
        "404":
          description: Nenhuma prestação de serviço encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    post:
      summary: Criar uma nova prestação de serviço
      tags:
        - PrestacaoServico
      description: Cria uma nova prestação de serviço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestacaoServico"
      responses:
        "200":
          description: Prestação de serviço criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /prestacao-servico/{id}:
    get:
      summary: Buscar uma prestação de serviço por ID
      tags:
        - PrestacaoServico
      description: Retorna uma prestação de serviço específica pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da prestação de serviço
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Prestação de serviço encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestacaoServico"
        "404":
          description: Prestação de serviço não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    put:
      summary: Atualizar uma prestação de serviço
      tags:
        - PrestacaoServico
      description: Atualiza uma prestação de serviço pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da prestação de serviço
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrestacaoServico"
      responses:
        "200":
          description: Prestação de serviço atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Prestação de serviço não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

    delete:
      summary: Apagar uma prestação de serviço
      tags:
        - PrestacaoServico
      description: Apaga uma prestação de serviço pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da prestação de serviço
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Prestação de serviço apagada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: Prestação de serviço não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"