# paths/proposta.yaml

paths:

  /proposta:
    get:
      summary: Listar todas as proposta
      tags:
        - Proposta
      description: Retorna uma lista de todas os proposta disponíveis
      responses:
        "200":
          description: Lista de proposta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/proposta"
        "404":
          description: Nenhuma proposta encontradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /proposta/create:
    post:
      summary: Criar uma nova proposta
      
      tags:
        - Proposta

      description: Cria uma nova proposta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposta"
      responses:
        "200":
          description: proposta criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /proposta/get-by-id/{id}:
    get:
      summary: Buscar uma proposta por ID
      
      tags:
        - Proposta
      
      description: Retorna uma proposta específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da proposta
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: proposta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: proposta não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /proposta/update/{id}:
    put:
      summary: Atualizar uma proposta
      
      tags:
        - Proposta

      description: Atualiza uma proposta pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do proposta a ser atualizado
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposta"
      responses:
        "200":
          description: proposta atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: proposta não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"

  /proposta/delete/{id}:
    delete:
      summary: Apagar uma proposta
    
      tags:
        - Proposta
      description: Apaga uma proposta específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do proposta a ser apagado
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: proposta apagado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSuccess"
        "404":
          description: proposta não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"